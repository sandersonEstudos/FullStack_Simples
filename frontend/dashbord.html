<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sistema</title>
</head>

<body>

    <div class="sidebar">
        <h3>Sistema</h3>

        <button onclick="logout()">
            Sair
        </button>
    </div>

    <div class="content">

        <div class="card">
            <h2>Cadastros</h2>

            <form id="formCadastro">

                <input type="hidden" id="id">

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome"
                    required
                >

                <button type="submit">Salvar</button>

            </form>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="tabelaUsuarios">
            </tbody>
        </table>

    </div>

    <script src="./script.js"></script>

</body>
</html>
